<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot | Becodewala</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="container">
        <div class="title">Let's Chat</div>
        <div class="chat" id="chat"></div>

        <!-- Main Options -->
        <div id="options" style="display: none;">
            <button onclick="sendQuickReply('Order Status')">Order Status</button>
            <button onclick="sendQuickReply('Return Policy')">Return Policy</button>
            <button onclick="sendQuickReply('Refund')">Refund</button>
            <button onclick="sendQuickReply('Shipping Options')">Shipping Options</button>
            <button onclick="sendQuickReply('Speak to Representative')">Speak to Representative</button>
        </div>

        <!-- Sub Options -->
        <div id="subOptions" style="display: none;">
            <button onclick="sendQuickReply('Ordered Item')">Ordered Item</button>
            <button onclick="sendQuickReply('Shipping Status')">Shipping Status</button>
            <button onclick="sendQuickReply('Delivery Address Change')">Delivery Address Change</button>
            <button onclick="sendQuickReply('Damage')">Damage</button>
            <button onclick="sendQuickReply('Color')">Color</button>
            <button onclick="sendQuickReply('Size')">Size</button>
            <button onclick="sendQuickReply('Mismatched')">Mismatched</button>
        </div>

        <input type="text" class="input" id="input" placeholder="Type your message here...." />
        <button class="button" id="button">
            <i class="fa-brands fa-telegram"></i>
        </button>
    </div>

<script>
function chatbot(input) {
    let output = "";
    input = input.toLowerCase();

    if (input.includes("hello") || input.includes("hi")) {
        output = "Hello! Welcome to our support service. How may I assist you today?";
        document.getElementById("options").style.display = "block";
        document.getElementById("subOptions").style.display = "none";

    } else if (input.includes("order status")) {
        output = "You can check the status of your order here.";
        document.getElementById("subOptions").style.display = "block";

    } else if (input.includes("return policy")) {
        output = "You can select a reason for your return.";
        document.getElementById("subOptions").style.display = "block";

    } else if (input.includes("ordered item")) {
        output = "Your ordered item details are as follows: ...";
        document.getElementById("subOptions").style.display = "none";

    } else if (input.includes("shipping status")) {
        output = "Your shipping status is: ...";
        document.getElementById("subOptions").style.display = "none";

    } else if (input.includes("delivery address change")) {
        output = "To change your delivery address, please provide the new address.";
        document.getElementById("subOptions").style.display = "none";

    } else if (input.includes("damage")) {
        output = "I'm sorry to hear about the damage. Please provide more details.";
        document.getElementById("subOptions").style.display = "none";

    } else if (input.includes("color")) {
        output = "Please specify the color issue you are facing.";
        document.getElementById("subOptions").style.display = "none";

    } else if (input.includes("size")) {
        output = "What size issue are you experiencing?";
        document.getElementById("subOptions").style.display = "none";

    } else if (input.includes("mismatched")) {
        output = "Could you please elaborate on the mismatch?";
        document.getElementById("subOptions").style.display = "none";

    } else if (input.includes("refund")) {
        output = "Refunds are processed within 7-10 business days.";

    } else if (input.includes("shipping options")) {
        output = "We offer standard, express, and next-day shipping.";

    } else if (input.includes("speak to representative")) {
        output = "Connecting you to a representative...";

    } else {
        output = "Please provide more details about your query.";
    }

    return output;
}

function displayUserMessage(message) {
    let chat = document.getElementById("chat");
    let userMessage = document.createElement("div");
    userMessage.classList.add("message", "user");

    // ✅ FIXED HERE
    userMessage.innerHTML = `<div class="text">${message}</div>`;

    chat.appendChild(userMessage);
    chat.scrollTop = chat.scrollHeight;
}

function displayBotMessage(message) {
    let chat = document.getElementById("chat");
    let botMessage = document.createElement("div");
    botMessage.classList.add("message", "bot");

    // ✅ FIXED HERE
    botMessage.innerHTML = `<div class="text">${message}</div>`;

    chat.appendChild(botMessage);
    chat.scrollTop = chat.scrollHeight;
}

function sendQuickReply(text) {
    displayUserMessage(text);
    let output = chatbot(text);

    setTimeout(() => {
        displayBotMessage(output);
    }, 800);
}

function sendMessage() {
    let input = document.getElementById("input").value;

    if (input.trim() !== "") {
        displayUserMessage(input);

        let output = chatbot(input);

        setTimeout(() => {
            displayBotMessage(output);
        }, 800);

        document.getElementById("input").value = "";
    }
}

// Button click
document.getElementById("button").addEventListener("click", sendMessage);

// Enter key
document.getElementById("input").addEventListener("keypress", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});
</script>

<style>
* {
    box-sizing: border-box;
}
body {
    font-family: 'Poppins', sans-serif;
    background: #222831;
}
.container {
    width: 600px;
    margin: 50px auto;
    padding: 20px;
    border-radius: 10px;
    background: #31363F;
}
.title {
    text-align: center;
    font-size: 24px;
    color: #fff;
}
.chat {
    height: 300px;
    overflow-y: scroll;
    margin: 20px 0;
    padding: 10px;
    background: #222831;
}
.message {
    display: flex;
    margin: 10px 0;
}
.user {
    justify-content: flex-end;
}
.bot {
    justify-content: flex-start;
}
.text {
    max-width: 70%;
    padding: 10px;
    border-radius: 10px;
    color: white;
}
.user .text {
    background: #4a4d52;
}
.bot .text {
    background: #8c8c8e;
}
.input {
    width: 100%;
    padding: 10px;
    font-size: 16px;
}
.button {
    position: absolute;
    margin-left: -60px;
    background: none;
    border: none;
    color: white;
    cursor: pointer;
}
#options button, #subOptions button {
    margin: 5px;
    padding: 8px;
    border: none;
    background: #4a4d52;
    color: white;
    border-radius: 5px;
}
</style>

</body>
</html>
